name: Dependency Submission

on:
  push:
    # 임시: 수정 검증 동안 세션 브랜치에서도 돌림 (녹색 확인 후 master 로 환원)
    branches: [ master, arena/cb3eaa9d-ghidra ]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV 

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        # gradle-version 핀 제거: 저장소의 커스텀 gradlew 가 래퍼 폴백과
        # Gradle 9.8.0 디스트 핀을 책임져요 (Fetch Dependencies 성공 경로와 동일).
