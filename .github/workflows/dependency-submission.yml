name: Dependency Submission

on:
  push:
    # 임시: 수정 검증 동안 세션 브랜치에서도 돌림 (녹색 확인 후 master 로 환원)
    branches: [ master, arena/cb3eaa9d-ghidra ]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV 

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # 이 저장소엔 gradle/wrapper 가 없어요 (Ghidra 는 커스텀 gradlew +
          # RuntimeScripts 래퍼 폴백). 액션은 래퍼가 없으면 버전을 지정해야
          # 해요 (실측 오류 메시지가 그대로 가르쳐줌). 값은 저장소의 실제
          # Gradle = 9.8.0 (커스텀 gradlew 의 GRADLE_DIST_DIR 핀과 동일;
          # 9.5.1 은 근거 없는 제 추측이었어요).
          gradle-version: '9.8.0'
