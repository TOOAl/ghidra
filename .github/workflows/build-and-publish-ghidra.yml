#
# 전체 자동화 파이프라인:
#   1. Ghidra 12.3 전체를 소스에서 빌드
#   2. 빌드된 zip으로 analyzeHeadless 스모크 테스트
#   3. GitHub Release에 영구 게시 (다운로드 링크 공유 가능)
#
# ※ 이 파일은 웹 UI에서 커밋해야 합니다 (앱 토큰에는 workflows 권한이 없음).

name: Build And Publish Ghidra

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Upload the built distribution zip as a GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (blank = auto: ghidra-<version>-DEV-<sha>)'
        type: string
        required: false
        default: ''
      run_headless_smoke_test:
        description: 'Run analyzeHeadless on a sample binary after the build'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Read Ghidra JDK version
        run: |
          JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)
          APP_VER=$(awk -F'=' '$1=="application.version" {print $2}' Ghidra/application.properties)
          REL_NAME=$(awk -F'=' '$1=="application.release.name" {print $2}' Ghidra/application.properties)
          echo "JDK_VER=$JDK_VER" >> $GITHUB_ENV
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV
          echo "REL_NAME=$REL_NAME" >> $GITHUB_ENV
          echo "Ghidra $APP_VER ($REL_NAME) -> JDK $JDK_VER"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Cache Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/**', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        run: ./gradlew buildGhidra --parallel

      - name: Locate distribution zip
        id: dist
        run: |
          ZIP=$(ls -1 build/dist/ghidra_*.zip | head -n 1)
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "name=$(basename "$ZIP")" >> $GITHUB_OUTPUT
          ls -lh "$ZIP"

      - name: Headless smoke test
        if: ${{ inputs.run_headless_smoke_test }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghidra-dist
          unzip -q "${{ steps.dist.outputs.zip }}" -d /tmp/ghidra-dist
          DIST=$(find /tmp/ghidra-dist -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Distribution: $DIST"
          mkdir -p /tmp/ghidra-proj
          "$DIST/support/analyzeHeadless" /tmp/ghidra-proj SmokeTest \
            -import /bin/ls \
            -overwrite \
            -deleteProject \
            -analysisTimeoutPerFile 300
          echo "✅ analyzeHeadless smoke test passed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghidra-distribution
          path: ${{ steps.dist.outputs.zip }}
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.dist.outputs.zip }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG:-}" ]; then
            RELEASE_TAG="ghidra-${APP_VER}-${REL_NAME}-${GITHUB_SHA::8}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          NOTES=$(printf 'Automated build of Ghidra %s (%s)\n\n- Commit: %s\n- Branch: %s\n- Run: %s\n- Built on: %s\n' \
            "$APP_VER" "$REL_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" "$ZIP" \
              --title "Ghidra $APP_VER $REL_NAME" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          {
            echo "## ✅ Release published"
            echo ""
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Asset: \`$(basename "$ZIP")\`"
            echo ""
            echo "[다운로드 페이지]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
          } >> $GITHUB_STEP_SUMMARY
