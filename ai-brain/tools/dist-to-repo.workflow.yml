## ###
#
# 🚚 Export Headless Dist To Repo
#
# WHY THIS EXISTS
#   The AI brain's sandbox can only reach these hosts:
#       github.com · codeload.github.com · api.github.com
#       registry.npmjs.org · pypi.org · files.pythonhosted.org
#   A GitHub *release asset* redirects to release-assets.githubusercontent.com
#   and an *action artifact* to a similar host — both blocked, so the 564 MB
#   dist built by `Build And Publish Ghidra` cannot be fetched directly.
#   Committed repository CONTENT, however, is served by codeload.github.com,
#   which IS reachable.  So this workflow re-publishes the dist as ordinary
#   files on an orphan branch, where the sandbox can pull it down.
#
# WHAT IT DOES
#   1. downloads the already-built release zip (Actions run inside GitHub, so
#      they can reach release assets — no rebuild, no 30-minute compile)
#   2. trims it to the subset analyzeHeadless actually needs for x86-64 ELF/PE
#      (drops docs/, Extensions/, GPL/, every processor except the requested
#      ones, and Base/data/typeinfo + Base/data/symbols — 152 MB of Go/Rust
#      type info and symbol tables the brain never reads)
#   3. splits the result into <=95 MB chunks, because GitHub hard-rejects any
#      single committed file over 100 MB
#   4. commits the chunks to the orphan branch `ghidra-dist`, leaving master
#      and every working branch completely clean
#
# COST / CLEANUP
#   The orphan branch carries a few hundred MB.  It is disposable: once the
#   sandbox has fetched it, delete it with
#       git push origin --delete ghidra-dist
#   Nothing is merged, so master's history is never touched.
#
# HOW TO RUN  (this file must be committed through the web UI — the app token
#              used by the sandbox has no `workflows` scope, as
#              build-and-publish-ghidra.yml already notes)
#   github.com/TOOAl/ghidra → Add file → Create new file
#   path:  .github/workflows/dist-to-repo.yml
#   paste this file, then "Commit changes" → target: *new branch* `dist-loader`
#   Committing to that branch triggers this workflow automatically.
#   (Alternatively, once committed, run it from the Actions tab → Run workflow.)

name: Export Headless Dist To Repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the built zip"
        default: "ghidra-12.3-DEV-e7105fbd"
      processors:
        description: "Processor modules to keep, space separated"
        default: "x86"
      branch:
        description: "Orphan branch to publish the chunks on"
        default: "ghidra-dist"
  push:
    branches: ["dist-loader"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read the JDK version Ghidra wants
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> "$GITHUB_ENV"

      - name: Download the already-built release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'ghidra-12.3-DEV-e7105fbd' }}
        run: |
          mkdir -p /tmp/rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern '*.zip' --dir /tmp/rel
          ls -la /tmp/rel

      - name: Trim to the headless subset
        env:
          KEEP_PROCESSORS: ${{ github.event.inputs.processors || 'x86' }}
        run: |
          set -euo pipefail
          cd /tmp/rel
          unzip -q *.zip && rm -f *.zip
          ROOT="$(ls -d ghidra_*)"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          du -sh "$ROOT"

          # Drop what analyzeHeadless never reads.
          rm -rf "$ROOT/docs" "$ROOT/Extensions" "$ROOT/GPL" \
                 "$ROOT/Ghidra/Dev" "$ROOT/Ghidra/Config" \
                 "$ROOT/Ghidra/Features/Base/data/typeinfo" \
                 "$ROOT/Ghidra/Features/Base/data/symbols"

          # Keep only the requested processor modules (the compiled .slas
          # language specs are the single biggest item in a full dist).
          if [ -d "$ROOT/Ghidra/Processors" ]; then
            keep=" $KEEP_PROCESSORS "
            for d in "$ROOT"/Ghidra/Processors/*/; do
              name="$(basename "$d")"
              case "$keep" in *" $name "*) ;; *) rm -rf "$d" ;; esac
            done
          fi

          du -sh "$ROOT"
          du -sm "$ROOT"/Ghidra/* "$ROOT"/support 2>/dev/null | sort -rn | head -20

      - name: Pack and split into sub-100MB chunks
        run: |
          set -euo pipefail
          cd /tmp/rel
          tar czf /tmp/ghidra_headless.tgz "$ROOT"
          ls -la /tmp/ghidra_headless.tgz
          mkdir -p /tmp/chunks && cd /tmp/chunks
          split -b 95m -d -a 2 /tmp/ghidra_headless.tgz ghidra_headless.tgz.part
          sha256sum /tmp/ghidra_headless.tgz | awk '{print $1}' > SHA256SUMS.txt
          ls -la
          echo "CHUNKS=$(ls ghidra_headless.tgz.part* | wc -l)" >> "$GITHUB_ENV"

      - name: Publish chunks to the orphan branch
        env:
          OUT_BRANCH: ${{ github.event.inputs.branch || 'ghidra-dist' }}
        run: |
          set -euo pipefail
          # v2 fixes two defects measured against run #1 (exit 128):
          #   1. the README heredoc terminator was indented inside this YAML
          #      block, so bash never closed it and swallowed git add/commit/
          #      push as README text — the push never ran at all;
          #   2. `git config` ran BEFORE any repository existed, dying with
          #      "fatal: not in a git directory" (exit 128) whenever the step's
          #      cwd was not the checkout.
          # Now: configure INSIDE the fresh repo, and write the README with a
          # brace group instead of a heredoc.
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cd /tmp/publish
          git init -q -b "$OUT_BRANCH"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/chunks/* .
          {
            echo "# Ghidra headless dist - chunked for sandbox delivery"
            echo
            echo "Reassemble with:"
            echo
            echo "    cat ghidra_headless.tgz.part* > ghidra_headless.tgz"
            echo "    sha256sum -c <(echo "$(cat SHA256SUMS.txt)  ghidra_headless.tgz")"
            echo "    tar xzf ghidra_headless.tgz"
            echo
            echo "Disposable branch. Delete once consumed:"
            echo
            echo "    git push origin --delete $OUT_BRANCH"
          } > README.md
          git add -A
          git commit -q -m "chore: publish trimmed headless Ghidra dist ($CHUNKS chunks)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          echo "pushing $(du -sh . | cut -f1) in $CHUNKS chunks to $OUT_BRANCH ..."
          if ! err=$(git push -f origin "$OUT_BRANCH" 2>&1); then
            echo "$err"
            echo "::error::push rejected — log above says why (token write scope / branch rules / size)"
            exit 1
          fi
          echo "✅ published to $OUT_BRANCH"

      - name: Report
        run: |
          echo "### 🚚 Headless dist published" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`${{ github.event.inputs.branch || 'ghidra-dist' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- chunks: $CHUNKS (<=95 MB each)" >> "$GITHUB_STEP_SUMMARY"
          echo "- processors kept: \`${{ github.event.inputs.processors || 'x86' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fetch it from the sandbox with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "curl -sSL -o dist.tgz https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/refs/heads/${{ github.event.inputs.branch || 'ghidra-dist' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
