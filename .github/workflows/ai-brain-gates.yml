name: AI Brain Gates

# 🧠 ai-brain 게이트를 **자동으로** 돌리는 워크플로.
#
# WHY THIS EXISTS
#   v7.3.8 감사에서 이상한 일을 확인했어요: 게이트 6개가 전부 그린인 상태인데도
#   그 안에서 침묵 오답 2건이 살아 있었어요. 원인은 두 가지였죠 —
#     (a) 게이트가 기능("이 함수가 맞게 craft 되는가")만 묻고 구조는 안 물었다
#         → tools/test_audit_structural.py (불변식 게이트) 신설로 해결
#     (b) 게이트가 **아예 자동으로 돌지 않았다** (수동 실행뿐)
#         → 이 워크플로로 해결
#   자동으로 돌지 않는 게이트는 "어제 누군가 돌렸을 때 그린"이었을 뿐이에요.
#
#   build-ghidra.yml 은 push 시 ai-brain/** 만 바뀐 경우 10분짜리 C++/Java 빌드를
#   건너뛰어요. 그래서 두뇌 코드만 바뀐 PR 은 지금까지 **아무 검증도 없이** 병합될 수
#   있었죠. 이 워크플로가 그 구멍을 막아요(전체 ~20초).
#
# 여기서 돌리지 않는 것 (정직 고지)
#   verify_gather_flags.py · verify_ghidra_facts.py 는 **live Ghidra dist + gcc** 가
#   필요해요(러너에 dist 를 배달하는 건 이 워크플로의 목적과 안 맞아요).
#   로컬에서 `bash ai-brain/tools/fetch_ghidra_dist.sh` 후 jdkenv 파이썬으로
#   실행해요. 두 도구 모두 선행조건이 없으면 추측하지 않고 rc=3 으로 정직 skip 해요.

on:
  push:
    paths:
      - 'ai-brain/**'
      - '.github/workflows/ai-brain-gates.yml'
  pull_request:
    paths:
      - 'ai-brain/**'
      - '.github/workflows/ai-brain-gates.yml'

jobs:
  gates:
    # ubuntu-24.04 로 고정 — build-ghidra.yml 과 같은 이유(재현 가능한 glibc).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-brain
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # vendor 휠(cp311)·jdkenv 와 같은 계열로 맞춰요
          python-version: '3.11'

      - name: Compile all brain sources
        run: |
          python -m compileall -q brain_engine tools launch_brain.py

      # 각 게이트를 **따로** 스텝으로 두어요 — 어느 게이트가 깨졌는지 로그를
      # 뒤지지 않아도 바로 보이게.
      - name: Gate — structural audit invariants
        run: python tools/test_audit_structural.py

      - name: Gate — N4 muldiv (oracle vs gcc native ground truth)
        run: python tools/test_n4_muldiv.py

      - name: Gate — N3 control flow + memory craft
        run: python tools/test_n3_craft.py

      - name: Gate — N3 SLM online synthesis + hallucination defence
        run: python tools/test_n3_slm_online.py

      - name: Gate — quest resilience
        run: python tools/test_quest_resilience.py

      - name: Gate — Windows offline bootstrap
        run: python tools/verify_windows_bootstrap.py

      - name: Gate — brain self audit (4 criteria)
        run: python tools/audit_brain.py

      # 메타 게이트 — **위에 있는 게이트 전부**의 자기효능 검증이에요. 원래 결함 38종을
      # 되살렸을 때 해당 게이트가 정말로 빨개지는지(그리고 *기대한 그 검사*로 빨개지는지)
      # 매 실행마다 측정해요. 게이트를 약화시키면 여기서 드러나요.
      # 스스로 베이스라인(변이 없음)을 먼저 요구하므로 뒤에 두어요. 파일을 변이시킨 뒤
      # sha256 로 원본 복원을 검증하고, 마지막에 게이트 전부를 다시 돌려 트리를 증명해요.
      # live Ghidra 가 필요한 verify_* 2종은 rc=3 정직 skip 이라 대상에서 제외(미측정).
      - name: Gate — mutation suite (do the gates still catch the defects)
        run: python tools/test_mutation_suite.py
